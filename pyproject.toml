[project]
name = "gh-nightshift"
version = "0.1.0"
description = "Night shift: Claude agents build your GitHub issues overnight in parallel lanes (gh extension + reusable workflows)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["UP007", "B905"]
