# gh-nightshift: the red-team scan. A read-only attacker's pass over what changed on main since the last scan.
#   context  (GITHUB_TOKEN, read)   decide whether to scan; run the security rules; write the scan context
#   scan     (Claude token only)    read-only Claude run -> findings, ENCRYPTED with the Claude token and passed on
#                                   as a job output (a job output is printed in the next job's log, and logs and
#                                   artifacts of a public repo are readable by anyone, so plaintext never leaves)
#   validate (Claude token only)    optional (redteam.validate, private repos): one fresh runner per new finding, at
#                                   most three. Claude writes a repro test; the harness runs it twice and seals the
#                                   verdict. The one red-team job where a model has a shell: no GitHub token is used
#   file     (PAT or App token)     decrypt inside a pipe; file new findings as draft private security advisories
#                                   (public repo) or `security` + `human` issues (private repo); record the commit
name: night-shift-redteam

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner labels (JSON) for the jobs that hold a GitHub token or the App key
        type: string
        required: false
        default: '"ubuntu-latest"'
      agent_runs_on:
        description: Runner labels (JSON) for the Claude-only scan job; never a box that runs the token jobs
        type: string
        required: false
        default: '"ubuntu-latest"'
      full:
        description: Scan the whole tree instead of only what changed since the last scan
        type: boolean
        required: false
        default: false
      model:
        type: string
        required: false
        default: opus
      tool_repo:
        type: string
        required: false
        default: paawandesai/gh-nightshift
      tool_ref:
        type: string
        required: false
        default: main
      app_id:
        description: GitHub App id (auth.mode app); empty means the PAT
        type: string
        required: false
        default: ""
      environment:
        description: GitHub environment for the jobs that hold the PAT or the App key (H2); empty means none
        type: string
        required: false
        default: ""
    secrets:
      claude_token:
        required: false
      agent_pat:
        required: false   # one of agent_pat or app_id + app_private_key
      app_private_key:
        required: false

env:
  REPO: ${{ github.repository }}
  PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
  # Never import from the checked-out repo: a planted json.py or nightshift/ would run with the token.
  PYTHONSAFEPATH: "1"

jobs:
  context:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 15
    outputs:
      run: ${{ steps.ctx.outputs.run }}
      sha: ${{ steps.ctx.outputs.sha }}
      base: ${{ steps.ctx.outputs.base }}
      validate: ${{ steps.ctx.outputs.validate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - name: Scan context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED }}
          REF_NAME: ${{ github.ref_name }}
          FULL: ${{ inputs.full }}
        run: |
          set --
          if [ "$FULL" = "true" ]; then set -- --full; fi
          python3 -m nightshift redteam context --out-dir "$RUNNER_TEMP/redteam" --github-output "$GITHUB_OUTPUT" "$@"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.ctx.outputs.run == 'true'
        with:
          name: redteam-context
          path: ${{ runner.temp }}/redteam
          retention-days: 3

  scan:
    needs: context
    if: needs.context.outputs.run == 'true'
    runs-on: ${{ fromJSON(inputs.agent_runs_on) }}
    timeout-minutes: 60
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: redteam-context
          path: ${{ runner.temp }}/redteam
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          npm install -g --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || '2.1.319' }}"
          echo "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"
      - name: Scan (read-only)
        id: scan
        env:
          TOKEN: ${{ secrets.claude_token }}
          TOKEN_IN_ENV: ${{ vars.NIGHT_SHIFT_TOKEN_IN_ENV || 'false' }}
          MODEL: ${{ vars.REDTEAM_MODEL || inputs.model }}
        # Findings stay out of the log: only the exit code is printed. What leaves the job is the result fields
        # only, gzip'd, zero-padded to a fixed 64 KiB (so its size does not say whether anything was found) and
        # AES-256 encrypted with the Claude token (a masked secret the file job also holds).
        run: |
          set -uo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::red-team Claude token is empty"; exit 1; fi
          P="$RUNNER_TEMP/redteam"
          trap 'rm -f "$P/findings.json" "$P/slim.json" "$P/slim.gz"' EXIT
          # M4: the token reaches Claude on a pipe (fd 3), never in its environment, and Read is denied under /proc and
          # /sys, where this step's own environment block (which holds the token) can be read.
          token_fd() { if [ "$TOKEN_IN_ENV" = "true" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$TOKEN"; exec 3< /dev/null; else export CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3; exec 3< <(printf '%s' "$TOKEN"); fi; }
          # The token guard: a file that holds the token (or its base64 form) is never posted.
          leaks() { local t; t="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"; [ "${#t}" -ge 20 ] || return 1
            grep -qaF -f <(printf '%s\n' "$t"; printf '%s' "$t" | base64 | tr -d '\n'; echo) "$1"; }
          token_fd
          env -u TOKEN claude -p "$(cat "$P/prompt.md")" --output-format json --json-schema "$(cat "$P/schema.json")" \
            --model "$MODEL" --max-turns 120 --add-dir "$P" --allowedTools "Read,Grep,Glob" \
            --disallowedTools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//sys/**)" > "$P/findings.json" 2> /dev/null
          rc=$?; exec 3<&-; unset CLAUDE_CODE_OAUTH_TOKEN; echo "claude exit code: $rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if leaks "$P/findings.json"; then echo "::error::the scan's output held its Claude token; nothing is filed. Rotate the token."; exit 1; fi
          jq -c '{type, subtype, is_error, structured_output}' "$P/findings.json" > "$P/slim.json" 2> /dev/null \
            || { echo "::error::the scan did not return a JSON result"; exit 1; }
          gzip -9 -c "$P/slim.json" > "$P/slim.gz" || { echo "::error::could not compress the findings"; exit 1; }
          if [ "$(wc -c < "$P/slim.gz")" -gt 65536 ]; then echo "::error::the scan output is too large to seal"; exit 1; fi
          truncate -s 65536 "$P/slim.gz"   # zero padding; gzip readers stop at the end of the stream
          sealed=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:TOKEN < "$P/slim.gz" \
            | base64 | tr -d '\n') || { echo "::error::could not seal the findings"; exit 1; }
          # 64 KiB sealed is about 87,500 characters, under the 128 KiB limit for one environment variable in the file job.
          if [ "${#sealed}" -lt 80000 ] || [ "${#sealed}" -gt 120000 ]; then echo "::error::could not seal the findings"; exit 1; fi
          echo "findings=$sealed" >> "$GITHUB_OUTPUT"

  validate:
    needs: [context, scan]
    if: needs.context.outputs.validate == 'true'
    runs-on: ${{ fromJSON(inputs.agent_runs_on) }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2]
    outputs:
      # Each matrix job sets only its own output, so the three do not overwrite one another.
      r0: ${{ steps.seal.outputs.r0 }}
      r1: ${{ steps.seal.outputs.r1 }}
      r2: ${{ steps.seal.outputs.r2 }}
    env:
      INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      # The tool lives outside the workspace the model works in. (The model has a shell here, so this keeps honest
      # runs honest; it is not a wall. See SECURITY.md, "Validation".)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: redteam-context
          path: ${{ runner.temp }}/redteam
      - name: Pick this job's finding
        id: pick
        env:
          SEALED: ${{ needs.scan.outputs.findings }}
          SEAL_KEY: ${{ secrets.claude_token }}
        run: |
          set -euo pipefail
          mv .nightshift-tool "$RUNNER_TEMP/nightshift-tool"
          export PYTHONPATH="$RUNNER_TEMP/nightshift-tool"
          printf '%s' "$SEALED" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SEAL_KEY \
            | python3 -m nightshift redteam candidate --index "$INDEX" --findings-file - \
                --seen-file "$RUNNER_TEMP/redteam/seen.json" --out-dir "$RUNNER_TEMP/validate" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.pick.outputs.run == 'true'
        with:
          node-version: 22
      - name: Lane setup commands
        if: steps.pick.outputs.run == 'true'
        run: |
          if [ -s "$RUNNER_TEMP/validate/setup.sh" ]; then bash -euo pipefail "$RUNNER_TEMP/validate/setup.sh"; else echo "no setup commands for the owning lane"; fi
      - name: Install Claude Code
        if: steps.pick.outputs.run == 'true'
        run: |
          npm install -g --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || '2.1.319' }}"
          echo "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"
      - name: Note running processes
        id: procs
        if: steps.pick.outputs.run == 'true'
        run: echo "pids=$(ps -u "$(id -u)" -o pid= | tr -s ' \n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Write the repro test
        if: steps.pick.outputs.run == 'true'
        env:
          TOKEN: ${{ secrets.claude_token }}
          TOKEN_IN_ENV: ${{ vars.NIGHT_SHIFT_TOKEN_IN_ENV || 'false' }}
          MODEL: ${{ vars.REDTEAM_MODEL || inputs.model }}
          PERMISSION_FLAGS: ${{ vars.CLAUDE_PERMISSION_FLAGS || '--dangerously-skip-permissions' }}
        # The finding and the model's work stay out of the log: only the exit code is printed.
        run: |
          set -uo pipefail
          if [ -z "$TOKEN" ]; then echo "::error::red-team Claude token is empty"; exit 1; fi
          P="$RUNNER_TEMP/validate"
          if [ "$TOKEN_IN_ENV" = "true" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$TOKEN"; exec 3< /dev/null; else export CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3; exec 3< <(printf '%s' "$TOKEN"); fi
          # PYTHONPATH and PYTHONSAFEPATH are for the tool; with them the repo's own tests could not import the repo.
          # Every GITHUB_* variable is dropped too: some name the runner's file commands, and what is written to those
          # files runs in later steps, including the seal step, which holds the token.
          # shellcheck disable=SC2086  # PERMISSION_FLAGS is intentionally word-split
          ( for v in "${!GITHUB_@}"; do unset "$v"; done
            exec env -u TOKEN -u PYTHONPATH -u PYTHONSAFEPATH claude -p "$(cat "$P/prompt.md")" --output-format json \
              --json-schema "$(cat "$P/schema.json")" --model "$MODEL" --max-turns 80 --add-dir "$P" $PERMISSION_FLAGS \
              --disallowedTools "WebFetch,WebSearch,NotebookEdit" > "$P/claude.json" 2> /dev/null ) \
            && rc=0 || rc=$?
          exec 3<&-; unset CLAUDE_CODE_OAUTH_TOKEN; echo "claude exit code: $rc"
          exit 0   # a run that did not finish gets the verdict not_reproduced below, and is tried again next time
      # No secret is in this step's environment: it runs a test a model wrote.
      - name: Run the repro test twice (the harness decides)
        if: steps.pick.outputs.run == 'true'
        env:
          SHA: ${{ needs.context.outputs.sha }}
        run: |
          export PYTHONPATH="$RUNNER_TEMP/nightshift-tool"
          python3 -m nightshift redteam verify --out-dir "$RUNNER_TEMP/validate" --sha "$SHA"
      # Anything the model or its test left running could read the next step's environment, which holds the token.
      - name: Stop processes the run left behind
        if: always() && steps.pick.outputs.run == 'true' && runner.environment == 'github-hosted'
        env:
          BEFORE: ${{ steps.procs.outputs.pids }}
        run: |
          KEEP=" ${BEFORE} "
          P=$$
          while [ -n "$P" ] && [ "$P" -gt 1 ]; do KEEP="$KEEP $P "; P="$(ps -o ppid= -p "$P" | tr -d ' ')"; done
          for ROUND in 1 2 3; do
            for PID in $(ps -u "$(id -u)" -o pid=); do
              case "$KEEP" in *" $PID "*) continue ;; esac
              kill -9 "$PID" 2> /dev/null || true
            done
            echo "cleanup round $ROUND done"
          done
      - name: Seal the result
        id: seal
        if: steps.pick.outputs.run == 'true'
        env:
          SEAL_KEY: ${{ secrets.claude_token }}
        run: |
          export PYTHONPATH="$RUNNER_TEMP/nightshift-tool"
          python3 -m nightshift redteam seal --index "$INDEX" --out-dir "$RUNNER_TEMP/validate" --github-output "$GITHUB_OUTPUT"

  file:
    needs: [context, scan, validate]
    # Runs after validate whether it ran, was skipped or lost a matrix job: a finding without a result waits for
    # the next run. It never runs without a finished scan.
    if: always() && needs.context.outputs.run == 'true' && needs.scan.result == 'success'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Environment secrets of the same name replace the caller's: keep the PAT or App key there, limited to
    # the default branch, so a workflow pushed on another branch cannot read it.
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - name: Mint a GitHub App token (this repo only, advisories included, never Workflows)
        id: app
        if: inputs.app_id != ''
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: python3 -m nightshift app-token --advisories --github-output "$GITHUB_OUTPUT"
      - name: Check the token can file (no finding is read here)
        if: inputs.app_id == ''
        env:
          GH_TOKEN: ${{ secrets.agent_pat }}
        run: python3 -m nightshift check-pat --advisories
      - name: File findings privately
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.agent_pat }}
          NIGHT_SHIFT_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIGHT_SHIFT_LOGIN: ${{ steps.app.outputs.login }}
          SEALED: ${{ needs.scan.outputs.findings }}   # ciphertext only; the log shows it, which is fine
          SEAL_KEY: ${{ secrets.claude_token }}       # only to decrypt; this job never runs Claude
          SHA: ${{ needs.context.outputs.sha }}
          BASE: ${{ needs.context.outputs.base }}
          VALIDATION: ${{ needs.context.outputs.validate == 'true' && 'true' || 'false' }}
          VALIDATION_0: ${{ needs.validate.outputs.r0 }}   # ciphertext, like SEALED
          VALIDATION_1: ${{ needs.validate.outputs.r1 }}
          VALIDATION_2: ${{ needs.validate.outputs.r2 }}
        run: |
          set -euo pipefail
          printf '%s' "$SEALED" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SEAL_KEY \
            | python3 -m nightshift redteam publish --sha "$SHA" --base "$BASE" --findings-file - --validation "$VALIDATION"
