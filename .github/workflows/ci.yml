# CI for gh-nightshift itself: unit tests (Python 3.10 and 3.12), ruff, actionlint on the reusable
# workflows and on the caller workflows `init` generates, and the original kit's picker tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Original kit picker tests (legacy/hackathon-kit)
        run: python -m unittest discover -s legacy/hackathon-kit/github/night-shift/tests

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: pip install ruff==0.17.4 && ruff check nightshift tests
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          echo "$PWD" >> "$GITHUB_PATH"
      - name: actionlint (reusable workflows and this CI)
        run: ./actionlint -color .github/workflows/*.yml
      - name: actionlint (caller workflows generated by init)
        run: |
          set -euo pipefail
          T="$(mktemp -d)"; mkdir -p "$T/.night-shift" "$T/.github/workflows"
          cp examples/config.yml "$T/.night-shift/config.yml"
          printf 'name: CI\non: [push]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - run: "true"\n' > "$T/.github/workflows/ci.yml"
          python -m nightshift init --root "$T" --repo o/r --regenerate
          (cd "$T" && "$GITHUB_WORKSPACE/actionlint" -color .github/workflows/*.yml)
