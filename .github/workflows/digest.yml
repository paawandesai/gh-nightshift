# gh-nightshift: the morning digest. Posts what merged, what is stuck and what it cost on the night-log issue,
# refreshes the roadmap issue, and optionally sends the digest to a Slack or Discord webhook.
#   digest  (PAT)  read issues and PRs, post one comment, PATCH the roadmap body
name: night-shift-digest

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner labels (JSON) for the jobs that hold a GitHub token or the App key
        type: string
        required: false
        default: '"ubuntu-latest"'
      hours:
        type: string
        required: false
        default: "24"
      tool_repo:
        type: string
        required: false
        default: paawandesai/gh-nightshift
      tool_ref:
        type: string
        required: false
        default: main
      app_id:
        description: GitHub App id (auth.mode app); empty means the PAT
        type: string
        required: false
        default: ""
      environment:
        description: GitHub environment for the jobs that hold the PAT or the App key (H2); empty means none
        type: string
        required: false
        default: ""
    secrets:
      agent_pat:
        required: false   # one of agent_pat or app_id + app_private_key
      app_private_key:
        required: false
      webhook_url:
        required: false

permissions:
  contents: read

env:
  REPO: ${{ github.repository }}
  PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
  # Never import from the checked-out repo: a planted json.py or nightshift/ would run with the PAT.
  PYTHONSAFEPATH: "1"

jobs:
  digest:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Environment secrets of the same name replace the caller's: keep the PAT or App key there, limited to
    # the default branch, so a workflow pushed on another branch cannot read it.
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .night-shift
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - name: Mint a GitHub App token (this repo only, never the Workflows permission)
        id: app
        if: inputs.app_id != ''
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: python3 -m nightshift app-token --github-output "$GITHUB_OUTPUT"
      - name: Refresh the roadmap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.agent_pat }}
          NIGHT_SHIFT_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIGHT_SHIFT_LOGIN: ${{ steps.app.outputs.login }}
        run: python3 -m nightshift roadmap || echo "roadmap refresh failed; the digest still runs"
      - name: Post the digest
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.agent_pat }}
          NIGHT_SHIFT_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIGHT_SHIFT_LOGIN: ${{ steps.app.outputs.login }}
          NIGHT_SHIFT_WEBHOOK_URL: ${{ secrets.webhook_url }}
          HOURS: ${{ inputs.hours }}
        run: python3 -m nightshift digest --post --hours "$HOURS" --webhook-env NIGHT_SHIFT_WEBHOOK_URL
