# gh-nightshift: one lane's run. Called once per lane by the caller workflow `gh nightshift init` writes.
# Three jobs on three separate runners:
#   pick     (PAT)                 hand-offs, close/merge/update PRs, choose the issue, write the task file
#   agent    (Claude token only)   do the work; hands back result.json + a git bundle as artifacts
#   publish  (PAT)                 validate the bundle on a clean runner, push, open the PR, log
# The agent never shares a machine with the GitHub token, and lane setup runs only in the agent job.
name: night-shift-lane

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner labels (JSON) for the jobs that hold a GitHub token or the App key
        type: string
        required: false
        default: '"ubuntu-latest"'
      agent_runs_on:
        description: Runner labels (JSON) for the Claude-only agent jobs; never a box that runs the token jobs
        type: string
        required: false
        default: '"ubuntu-latest"'
      lane:
        type: string
        required: true
      main_branch:
        type: string
        required: false
        default: ""
      only_lane:
        type: string
        required: false
        default: ""
      tool_repo:
        description: Where gh-nightshift's scripts come from (keep in sync with the `uses:` line).
        type: string
        required: false
        default: paawandesai/gh-nightshift
      tool_ref:
        description: The same ref as the `uses:` line, so workflows and scripts always match.
        type: string
        required: false
        default: main
      app_id:
        description: GitHub App id (auth.mode app); empty means the PAT
        type: string
        required: false
        default: ""
      environment:
        description: GitHub environment for the jobs that hold the PAT or the App key (H2); empty means none
        type: string
        required: false
        default: ""
    secrets:
      claude_token:
        required: false   # checked in the pick job so a missing one gives a clear error
      claude_token_fallback:
        required: false   # optional second Claude token, used only when the first one cannot start a run
      agent_pat:
        required: false   # one of agent_pat or app_id + app_private_key
      app_private_key:
        required: false

permissions:
  contents: read

env:
  LANE: ${{ inputs.lane }}
  REPO: ${{ github.repository }}
  MAIN_BRANCH: ${{ inputs.main_branch || github.event.repository.default_branch || 'main' }}

jobs:
  pick:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Environment secrets of the same name replace the caller's: keep the PAT or App key there, limited to
    # the default branch, so a workflow pushed on another branch cannot read it.
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
      # Never import from the checked-out repo: a planted json.py or nightshift/ would run with the PAT.
      # Set per PAT job only, so the agent job and your setup/test commands keep normal Python behaviour.
      PYTHONSAFEPATH: "1"
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      issue: ${{ steps.pick.outputs.issue }}
      fail_sha: ${{ steps.pick.outputs.fail_sha }}
      model: ${{ steps.pick.outputs.model }}
      prompt_version: ${{ steps.prep.outputs.prompt_version }}
      branch: ${{ steps.prep.outputs.branch }}
      title: ${{ steps.prep.outputs.title }}
      attempt_comment: ${{ steps.prep.outputs.attempt_comment }}
      postgres_image: ${{ steps.lane.outputs.postgres_image }}
      setup_action: ${{ steps.lane.outputs.setup_action }}
      max_turns: ${{ steps.lane.outputs.max_turns }}
      sudo: ${{ steps.lane.outputs.sudo }}
      task_artifact: ${{ steps.task_upload.outputs.artifact-id }}
      out_artifact: ${{ steps.prep.outputs.out_artifact }}
    steps:
      - name: Check out the repository (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          persist-credentials: false

      - name: Check out gh-nightshift scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - name: Mint a GitHub App token (this repo only, never the Workflows permission)
        id: app
        if: inputs.app_id != ''
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: python3 -m nightshift app-token --github-output "$GITHUB_OUTPUT"

      - name: Check lane token exists
        env:
          LANE_TOKEN: ${{ secrets.claude_token }}
          LANE_FALLBACK: ${{ secrets.claude_token_fallback }}
        run: |
          if [ -z "$LANE_TOKEN" ] && [ -z "$LANE_FALLBACK" ]; then echo "::error::The Claude token secret for lane $LANE is empty or missing (see .night-shift/config.yml)"; exit 1; fi
          if [ -z "$LANE_TOKEN" ]; then echo "::warning::The Claude token secret for lane $LANE is empty; the lane runs on its fallback token"; fi

      - name: Read lane config
        id: lane
        run: python3 -m nightshift lane-config --lane "$LANE" --github-output "$GITHUB_OUTPUT"

      - name: Check the PAT (account, no Workflows scope)
        if: inputs.app_id == ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.agent_pat }}
          NIGHT_SHIFT_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIGHT_SHIFT_LOGIN: ${{ steps.app.outputs.login }}
        run: python3 -m nightshift check-pat

      - name: Pick next issue
        id: pick
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.agent_pat }}
          NIGHT_SHIFT_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIGHT_SHIFT_LOGIN: ${{ steps.app.outputs.login }}
          AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED }}
          FIX_LANE: ${{ vars.FIX_LANE }}
          ONLY_LANE: ${{ inputs.only_lane }}
          ESCALATE_MODEL: ${{ vars.ESCALATE_MODEL }}
        run: python3 -m nightshift pick --lane "$LANE" --github-output "$GITHUB_OUTPUT"

      - name: Write task, prompt and record the attempt
        id: prep
        if: steps.pick.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.agent_pat }}
          NIGHT_SHIFT_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIGHT_SHIFT_LOGIN: ${{ steps.app.outputs.login }}
          MODE: ${{ steps.pick.outputs.mode }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          FAIL_SHA: ${{ steps.pick.outputs.fail_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -m nightshift task --lane "$LANE" --mode "$MODE" --issue "$ISSUE" --fail-sha "$FAIL_SHA" \
            --run-url "$RUN_URL" --out-dir "$RUNNER_TEMP/task" --github-output "$GITHUB_OUTPUT"
          # Every lane runs in the same workflow run and can list its artifacts. The agent's output goes under a
          # name no other lane can guess before it exists, and publish downloads it by the id the upload returned.
          echo "out_artifact=out-$LANE-$GITHUB_RUN_ATTEMPT-$(openssl rand -hex 12)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: task_upload
        if: steps.pick.outputs.mode != 'skip'
        with:
          name: task-${{ inputs.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task
          retention-days: 3

  agent:
    needs: pick
    if: needs.pick.outputs.mode != 'skip'
    runs-on: ${{ fromJSON(inputs.agent_runs_on) }}
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      out_artifact: ${{ steps.out_upload.outputs.artifact-id }}
    env:
      BRANCH: ${{ needs.pick.outputs.branch }}
      DATABASE_URL: ${{ needs.pick.outputs.postgres_image != '' && 'postgres://postgres:postgres@localhost:5432' || '' }}
    services:
      postgres:
        # An empty image means "no service": only lanes with postgres_image get a database.
        image: ${{ needs.pick.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.pick.outputs.task_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/task

      # Node for Claude Code, set up before the lane's own setup so a Node version the lane picks wins.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Lane setup commands
        run: |
          if [ -s "$RUNNER_TEMP/task/setup.sh" ]; then bash -euo pipefail "$RUNNER_TEMP/task/setup.sh"; else echo "no setup commands for lane $LANE"; fi

      # A lane's composite action is copied to a fixed path (a `uses:` path cannot be an expression)
      # and kept out of git so the agent can never commit it.
      - name: Stage lane setup action
        if: needs.pick.outputs.setup_action != ''
        env:
          SETUP_ACTION: ${{ needs.pick.outputs.setup_action }}
        run: |
          cp -r "$SETUP_ACTION" .ns-lane-setup
          echo ".ns-lane-setup/" >> .git/info/exclude
      - name: Lane setup action
        if: needs.pick.outputs.setup_action != ''
        uses: ./.ns-lane-setup

      # Claude Code goes into this job's temp directory, which the runner empties before every job, so
      # nothing a run leaves behind on a self-hosted machine is what the next job executes as `claude`.
      - name: Install Claude Code
        run: |
          npm install -g --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || '2.1.319' }}"
          echo "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"

      # Taken after setup, so the cleanup step below stops only what the agent started.
      - name: Note running processes
        id: procs
        run: echo "pids=$(ps -u "$(id -u)" -o pid= | tr -s ' \n' ' ')" >> "$GITHUB_OUTPUT"

      # Lane option `sudo: false`. Setup ran with sudo; the agent does not get it, so it cannot become root and read
      # the runner's own tokens from memory. GitHub-hosted runners only: on a self-hosted machine this would be a
      # lasting change, so there it is the machine owner's job to run the agent user without sudo.
      - name: Remove sudo before the agent runs
        if: needs.pick.outputs.sudo == 'false'
        env:
          HAS_SERVICE: ${{ needs.pick.outputs.postgres_image != '' }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_KIND" != "github-hosted" ]; then
            echo "::warning::sudo: false is applied only on GitHub-hosted runners; run self-hosted agent runners as a user without sudo"
            exit 0
          fi
          # The docker group is root by another name. A lane with a database keeps it (the runner stops the
          # service container through it after the job).
          if [ "$HAS_SERVICE" != "true" ] && [ -S /var/run/docker.sock ]; then
            sudo chown root:root /var/run/docker.sock
            sudo chmod 600 /var/run/docker.sock
            if docker info > /dev/null 2>&1; then echo "::error::Docker still works after locking its socket"; exit 1; fi
          elif [ "$HAS_SERVICE" = "true" ]; then
            echo "::warning::postgres_image keeps Docker access, which is root-equivalent; sudo is still removed"
          fi
          sudo find /etc/sudoers.d -type f -delete
          sudo -k
          if sudo -n true 2> /dev/null; then echo "::error::sudo still works after removing /etc/sudoers.d"; exit 1; fi
          echo "sudo removed for the rest of this job"

      - name: Run agent
        id: agent
        env:
          # Only the lane's own token is here. The fallback token gets its own step, which runs only when this one
          # could not start, so a run that does not need it never holds it.
          LANE_CLAUDE_TOKEN: ${{ secrets.claude_token }}
          HAS_FALLBACK: ${{ secrets.claude_token_fallback != '' }}
          # 'true' puts the token back in Claude's environment (for Claude Code versions without
          # CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR). Tests and tools the agent runs can then read it.
          TOKEN_IN_ENV: ${{ vars.NIGHT_SHIFT_TOKEN_IN_ENV || 'false' }}
          MODEL: ${{ needs.pick.outputs.model || 'sonnet' }}
          MAX_TURNS: ${{ needs.pick.outputs.max_turns || '80' }}
          # This runner holds no GitHub write credentials. A GitHub-hosted one is discarded after the job;
          # a self-hosted one is not, so register agent runners as ephemeral (see SECURITY.md).
          PERMISSION_FLAGS: ${{ vars.CLAUDE_PERMISSION_FLAGS || '--dangerously-skip-permissions' }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build and test caches never belong in an agent PR, even when the repo has no .gitignore for them
          # (seen live: committed __pycache__/*.pyc failed the review's scope question). Untracked files only.
          printf '%s\n' '__pycache__/' '*.py[cod]' '.pytest_cache/' '.mypy_cache/' '.ruff_cache/' '.venv/' \
            'node_modules/' '.DS_Store' > "$RUNNER_TEMP/agent-excludes"
          git config core.excludesFile "$RUNNER_TEMP/agent-excludes"
          git switch -c "$BRANCH"
          if [ -z "$LANE_CLAUDE_TOKEN" ]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"; echo "no lane token; the fallback step runs"; exit 0
          fi
          PROMPT="$(sed "s|__TASK_FILE__|$RUNNER_TEMP/task/task.md|g" "$RUNNER_TEMP/task/prompt.md")"
          # Claude reads the token from a pipe (file descriptor 3), not from its environment, so the commands it
          # runs (tests, package scripts, `env`) do not inherit it. This stops accidental leaks; an agent that
          # sets out to find its own token still can, which is what the token guard below is for.
          if [ "$TOKEN_IN_ENV" = "true" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$LANE_CLAUDE_TOKEN"; exec 3< /dev/null
          else
            export CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3; exec 3< <(printf '%s' "$LANE_CLAUDE_TOKEN")
          fi
          # shellcheck disable=SC2086  # PERMISSION_FLAGS is intentionally word-split
          env -u LANE_CLAUDE_TOKEN claude -p "$PROMPT" --output-format json \
            --json-schema "$(cat "$RUNNER_TEMP/task/schema.json")" \
            --model "$MODEL" --max-turns "$MAX_TURNS" $PERMISSION_FLAGS > "$OUT/result.json" 2> "$OUT/claude.stderr" \
            && RC=0 || RC=$?  # the step runs under `bash -e`: keep the exit code instead of stopping here
          exec 3<&-
          unset CLAUDE_CODE_OAUTH_TOKEN
          echo "claude exit code: $RC (model $MODEL)"
          # Same rule as the publish job's infra-error: no structured output and fewer than 2 turns means the run
          # never really started (usage limit, expired or revoked token, outage). Both inputs are the agent's, so an
          # agent can force the fallback run; its processes are stopped before that step, which alone holds the
          # fallback token (on GitHub-hosted runners; a root process survives unless the lane sets sudo: false).
          TURNS="$(jq -r 'if (.structured_output | type) == "object" then 99 else (.num_turns // 0) end' \
            "$OUT/result.json" 2> /dev/null || echo 0)"
          if [ "$HAS_FALLBACK" = "true" ] && [ "${TURNS:-0}" -lt 2 ] && \
             [ "$(git rev-list --count "origin/$MAIN_BRANCH..HEAD")" -eq 0 ]; then
            echo "::warning::The lane's Claude token did not start a run (usage limit or sign-in); retrying with its fallback token"
            mv "$OUT/claude.stderr" "$OUT/claude.primary.stderr"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tail -n 50 "$OUT/claude.stderr" || true
          exit "$RC"

      # Before the fallback token is in any step's environment, end what the first run left behind.
      - name: Stop processes before the fallback run
        if: steps.agent.outputs.fallback == 'true' && runner.environment == 'github-hosted'
        env:
          BEFORE: ${{ steps.procs.outputs.pids }}
        run: |
          KEEP=" ${BEFORE} "
          P=$$
          while [ -n "$P" ] && [ "$P" -gt 1 ]; do KEEP="$KEEP $P "; P="$(ps -o ppid= -p "$P" | tr -d ' ')"; done
          for ROUND in 1 2 3; do
            for PID in $(ps -u "$(id -u)" -o pid=); do
              case "$KEEP" in *" $PID "*) continue ;; esac
              kill -9 "$PID" 2> /dev/null || true
            done
            echo "cleanup round $ROUND done"
          done

      - name: Run agent (fallback token)
        if: steps.agent.outputs.fallback == 'true'
        env:
          LANE_CLAUDE_FALLBACK: ${{ secrets.claude_token_fallback }}
          TOKEN_IN_ENV: ${{ vars.NIGHT_SHIFT_TOKEN_IN_ENV || 'false' }}
          MODEL: ${{ needs.pick.outputs.model || 'sonnet' }}
          MAX_TURNS: ${{ needs.pick.outputs.max_turns || '80' }}
          PERMISSION_FLAGS: ${{ vars.CLAUDE_PERMISSION_FLAGS || '--dangerously-skip-permissions' }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          if [ -z "$LANE_CLAUDE_FALLBACK" ]; then echo "::error::The lane has no Claude token that works"; exit 1; fi
          git checkout -q -- . 2> /dev/null || true
          PROMPT="$(sed "s|__TASK_FILE__|$RUNNER_TEMP/task/task.md|g" "$RUNNER_TEMP/task/prompt.md")"
          if [ "$TOKEN_IN_ENV" = "true" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$LANE_CLAUDE_FALLBACK"; exec 3< /dev/null
          else
            export CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3; exec 3< <(printf '%s' "$LANE_CLAUDE_FALLBACK")
          fi
          # shellcheck disable=SC2086  # PERMISSION_FLAGS is intentionally word-split
          env -u LANE_CLAUDE_FALLBACK claude -p "$PROMPT" --output-format json \
            --json-schema "$(cat "$RUNNER_TEMP/task/schema.json")" \
            --model "$MODEL" --max-turns "$MAX_TURNS" $PERMISSION_FLAGS > "$OUT/result.json" 2> "$OUT/claude.stderr" \
            && RC=0 || RC=$?  # the step runs under `bash -e`: keep the exit code instead of stopping here
          exec 3<&-
          echo "claude exit code: $RC (model $MODEL)"
          echo "claude token: fallback"
          tail -n 50 "$OUT/claude.stderr" || true
          exit "$RC"

      # Anything the agent left running (a server, a background job) could rewrite the commits or the result while
      # they are packaged and checked. Every process of this user that was not there before the agent ran is ended.
      - name: Stop processes the agent left behind
        # GitHub-hosted only: on a self-hosted machine another runner of the same user may be running a job.
        if: always() && runner.environment == 'github-hosted'
        env:
          BEFORE: ${{ steps.procs.outputs.pids }}
        run: |
          KEEP=" ${BEFORE} "
          P=$$
          while [ -n "$P" ] && [ "$P" -gt 1 ]; do KEEP="$KEEP $P "; P="$(ps -o ppid= -p "$P" | tr -d ' ')"; done
          for ROUND in 1 2 3; do
            for PID in $(ps -u "$(id -u)" -o pid=); do
              case "$KEEP" in *" $PID "*) continue ;; esac
              kill -9 "$PID" 2> /dev/null || true
            done
            echo "cleanup round $ROUND done"
          done

      - name: Package commits
        if: always()
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          STATUS="$(jq -r '.structured_output.status // empty' "$OUT/result.json" 2>/dev/null || true)"
          if [ "$STATUS" = "done" ] && [ -n "$(git status --porcelain)" ]; then
            git add -A && git commit -m "night-shift($LANE): uncommitted changes from agent run"
          fi
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "$BRANCH" ] && \
             [ "$(git rev-list --count "origin/$MAIN_BRANCH..HEAD")" -gt 0 ]; then
            git bundle create "$OUT/agent.bundle" "$BRANCH" "^origin/$MAIN_BRANCH"
          fi
          ls -la "$OUT"

      # Everything that leaves this runner (the commits, the result and the log, all in the artifact) is searched
      # for the lane's Claude token first. On a hit nothing is uploaded and the issue goes to a person.
      - name: Token guard
        if: always()
        env:
          LANE_CLAUDE_TOKEN: ${{ secrets.claude_token }}
          # Only a run that used the fallback token can have leaked it, so only then does the guard hold it.
          LANE_CLAUDE_FALLBACK: ${{ steps.agent.outputs.fallback == 'true' && secrets.claude_token_fallback || '' }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          PATTERNS="$(mktemp)"; chmod 600 "$PATTERNS"
          # Each token (the lane's and its fallback) and its base64 form, read from a file so none appears in a
          # command line.
          for RAW in "$LANE_CLAUDE_TOKEN" "${LANE_CLAUDE_FALLBACK:-}"; do
            TOKEN="$(printf '%s' "$RAW" | tr -d '[:space:]')"
            if [ "${#TOKEN}" -ge 20 ]; then
              { printf '%s\n' "$TOKEN"; printf '%s' "$TOKEN" | base64 | tr -d '\n'; echo; } >> "$PATTERNS"
            fi
          done
          if [ ! -s "$PATTERNS" ]; then rm -f "$PATTERNS"; echo "no token to guard"; exit 0; fi
          WHERE=""
          if grep -rqaF -f "$PATTERNS" "$OUT"; then WHERE="the run's result or log"; fi
          if git rev-parse -q --verify "refs/heads/$BRANCH" > /dev/null; then
            RANGE="origin/$MAIN_BRANCH..refs/heads/$BRANCH"
            # Only when the run made commits: with none, `xargs -r` runs nothing and exits 0, which would read
            # as a match and withhold every run that ends blocked or waiting.
            if [ "$(git rev-list --count "$RANGE")" -gt 0 ]; then
              if git log --format=%B "$RANGE" | grep -qaF -f "$PATTERNS" || \
                 git rev-list "$RANGE" | xargs git grep -qaF -f "$PATTERNS"; then
                WHERE="${WHERE:+$WHERE and }its commits"
              fi
            fi
          fi
          rm -f "$PATTERNS"
          if [ -n "$WHERE" ]; then
            rm -rf "$OUT"; mkdir -p "$OUT"
            jq -n --arg where "$WHERE" '{night_shift_guard: "token-leak", where: $where}' > "$OUT/result.json"
            echo "::error::The lane's Claude token appeared in $WHERE. Nothing from this run was uploaded; rotate the token."
          else
            echo "token guard: clean"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: out_upload
        if: always()
        with:
          name: ${{ needs.pick.outputs.out_artifact }}
          path: ${{ runner.temp }}/out
          retention-days: 3

  publish:
    needs: [pick, agent]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.mode != 'skip'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Environment secrets of the same name replace the caller's: keep the PAT or App key there, limited to
    # the default branch, so a workflow pushed on another branch cannot read it.
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
      PYTHONSAFEPATH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out gh-nightshift scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - name: Mint a GitHub App token (this repo only, never the Workflows permission)
        id: app
        if: inputs.app_id != ''
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: python3 -m nightshift app-token --github-output "$GITHUB_OUTPUT"

      # By the id the agent job's upload returned, never by name: another lane could upload under a name first.
      # No id (the agent job failed before uploading) means nothing to download; publish reports the failure.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.agent.outputs.out_artifact != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.agent.outputs.out_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/out

      - name: Validate, open PR, report
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.agent_pat }}
          NIGHT_SHIFT_APP_TOKEN: ${{ steps.app.outputs.token }}
          NIGHT_SHIFT_LOGIN: ${{ steps.app.outputs.login }}
          MODE: ${{ needs.pick.outputs.mode }}
          ISSUE: ${{ needs.pick.outputs.issue }}
          BRANCH: ${{ needs.pick.outputs.branch }}
          TITLE: ${{ needs.pick.outputs.title }}
          ATTEMPT_COMMENT: ${{ needs.pick.outputs.attempt_comment }}
          FAIL_SHA: ${{ needs.pick.outputs.fail_sha }}
          MODEL: ${{ needs.pick.outputs.model }}
          PROMPT_VERSION: ${{ needs.pick.outputs.prompt_version }}
        run: |
          python3 -m nightshift publish --lane "$LANE" --mode "$MODE" --issue "$ISSUE" --branch "$BRANCH" \
            --title "$TITLE" --model "$MODEL" --attempt-comment "$ATTEMPT_COMMENT" --fail-sha "$FAIL_SHA" \
            --prompt-version "$PROMPT_VERSION" \
            --result "$RUNNER_TEMP/out/result.json" --bundle "$RUNNER_TEMP/out/agent.bundle"
