# gh-nightshift: one lane's run. Called once per lane by the caller workflow `gh nightshift init` writes.
# Three jobs on three separate runners:
#   pick     (PAT)                 hand-offs, close/merge/update PRs, choose the issue, write the task file
#   agent    (model token only)    do the work (Claude Code, or Codex for a `provider: codex` lane); hands back
#                                  the result + a git bundle as artifacts
#   publish  (PAT)                 validate the bundle on a clean runner, push, open the PR, log
# The agent never shares a machine with the GitHub token, and lane setup runs only in the agent job.
name: night-shift-lane

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner labels (JSON) for the jobs that hold a GitHub token or the App key
        type: string
        required: false
        default: '"ubuntu-latest"'
      agent_runs_on:
        description: Runner labels (JSON) for the agent jobs (model token only); never a box that runs the token jobs
        type: string
        required: false
        default: '"ubuntu-latest"'
      lane:
        type: string
        required: true
      main_branch:
        type: string
        required: false
        default: ""
      only_lane:
        type: string
        required: false
        default: ""
      tool_repo:
        description: Where gh-nightshift's scripts come from (keep in sync with the `uses:` line).
        type: string
        required: false
        default: paawandesai/gh-nightshift
      tool_ref:
        description: The same ref as the `uses:` line, so workflows and scripts always match.
        type: string
        required: false
        default: main
      app_id:
        description: GitHub App id (auth.mode app); empty means the PAT
        type: string
        required: false
        default: ""
    secrets:
      claude_token:
        required: false   # checked in the pick job so a missing one gives a clear error
      claude_token_fallback:
        required: false   # optional second Claude token, used only when the first one cannot start a run
      codex_token:
        required: false   # a `provider: codex` lane's OpenAI API key, passed instead of claude_token
      codex_token_fallback:
        required: false   # optional second OpenAI API key, used only when the first one cannot start a run
      agent_pat:
        required: false   # one of agent_pat or app_id + app_private_key
      app_private_key:
        required: false

permissions:
  contents: read

env:
  LANE: ${{ inputs.lane }}
  REPO: ${{ github.repository }}
  MAIN_BRANCH: ${{ inputs.main_branch || github.event.repository.default_branch || 'main' }}

jobs:
  pick:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
      # Never import from the checked-out repo: a planted json.py or nightshift/ would run with the PAT.
      # Set per PAT job only, so the agent job and your setup/test commands keep normal Python behaviour.
      PYTHONSAFEPATH: "1"
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      issue: ${{ steps.pick.outputs.issue }}
      fail_sha: ${{ steps.pick.outputs.fail_sha }}
      model: ${{ steps.pick.outputs.model }}
      prompt_version: ${{ steps.prep.outputs.prompt_version }}
      branch: ${{ steps.prep.outputs.branch }}
      title: ${{ steps.prep.outputs.title }}
      attempt_comment: ${{ steps.prep.outputs.attempt_comment }}
      postgres_image: ${{ steps.lane.outputs.postgres_image }}
      setup_action: ${{ steps.lane.outputs.setup_action }}
      max_turns: ${{ steps.lane.outputs.max_turns }}
      provider: ${{ steps.lane.outputs.provider }}
    steps:
      - name: Check out the repository (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          persist-credentials: false

      - name: Check out gh-nightshift scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - name: Mint a GitHub App token (this repo only, never the Workflows permission)
        if: inputs.app_id != ''
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: python3 -m nightshift app-token --github-env "$GITHUB_ENV"

      - name: Read lane config
        id: lane
        run: python3 -m nightshift lane-config --lane "$LANE" --github-output "$GITHUB_OUTPUT"

      # Only presence is checked here (`!= ''`): the token values never reach this job's environment.
      - name: Check lane token exists
        env:
          PROVIDER: ${{ steps.lane.outputs.provider }}
          HAS_CLAUDE: ${{ secrets.claude_token != '' }}
          HAS_CLAUDE_FALLBACK: ${{ secrets.claude_token_fallback != '' }}
          HAS_CODEX: ${{ secrets.codex_token != '' }}
          HAS_CODEX_FALLBACK: ${{ secrets.codex_token_fallback != '' }}
        run: |
          if [ "$PROVIDER" = "codex" ]; then
            KIND="Codex API key"; HAS="$HAS_CODEX"; HAS_FB="$HAS_CODEX_FALLBACK"; OTHER="$HAS_CLAUDE$HAS_CLAUDE_FALLBACK"
          else
            KIND="Claude token"; HAS="$HAS_CLAUDE"; HAS_FB="$HAS_CLAUDE_FALLBACK"; OTHER="$HAS_CODEX$HAS_CODEX_FALLBACK"
          fi
          if [ "$OTHER" != "falsefalse" ]; then
            echo "::error::Lane $LANE runs $PROVIDER but its job also passes the other provider's token; run gh nightshift init --regenerate"; exit 1
          fi
          if [ "$HAS" != "true" ] && [ "$HAS_FB" != "true" ]; then echo "::error::The $KIND secret for lane $LANE is empty or missing (see .night-shift/config.yml)"; exit 1; fi
          if [ "$HAS" != "true" ]; then echo "::warning::The $KIND secret for lane $LANE is empty; the lane runs on its fallback token"; fi

      - name: Check the PAT (account, no Workflows scope)
        if: inputs.app_id == ''
        env:
          GH_TOKEN: ${{ env.NIGHT_SHIFT_APP_TOKEN || secrets.agent_pat }}
        run: python3 -m nightshift check-pat

      - name: Pick next issue
        id: pick
        env:
          GH_TOKEN: ${{ env.NIGHT_SHIFT_APP_TOKEN || secrets.agent_pat }}
          AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED }}
          FIX_LANE: ${{ vars.FIX_LANE }}
          ONLY_LANE: ${{ inputs.only_lane }}
          ESCALATE_MODEL: ${{ vars.ESCALATE_MODEL }}
        run: python3 -m nightshift pick --lane "$LANE" --github-output "$GITHUB_OUTPUT"

      - name: Write task, prompt and record the attempt
        id: prep
        if: steps.pick.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ env.NIGHT_SHIFT_APP_TOKEN || secrets.agent_pat }}
          MODE: ${{ steps.pick.outputs.mode }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          FAIL_SHA: ${{ steps.pick.outputs.fail_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -m nightshift task --lane "$LANE" --mode "$MODE" --issue "$ISSUE" --fail-sha "$FAIL_SHA" \
            --run-url "$RUN_URL" --out-dir "$RUNNER_TEMP/task" --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.mode != 'skip'
        with:
          name: task-${{ inputs.lane }}
          path: ${{ runner.temp }}/task
          retention-days: 3

  agent:
    needs: pick
    if: needs.pick.outputs.mode != 'skip'
    runs-on: ${{ fromJSON(inputs.agent_runs_on) }}
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      BRANCH: ${{ needs.pick.outputs.branch }}
      DATABASE_URL: ${{ needs.pick.outputs.postgres_image != '' && 'postgres://postgres:postgres@localhost:5432' || '' }}
    services:
      postgres:
        # An empty image means "no service": only lanes with postgres_image get a database.
        image: ${{ needs.pick.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: task-${{ inputs.lane }}
          path: ${{ runner.temp }}/task

      # Node for Claude Code or Codex, set up before the lane's own setup so a Node version the lane picks wins.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lane setup commands
        run: |
          if [ -s "$RUNNER_TEMP/task/setup.sh" ]; then bash -euo pipefail "$RUNNER_TEMP/task/setup.sh"; else echo "no setup commands for lane $LANE"; fi

      # A lane's composite action is copied to a fixed path (a `uses:` path cannot be an expression)
      # and kept out of git so the agent can never commit it.
      - name: Stage lane setup action
        if: needs.pick.outputs.setup_action != ''
        env:
          SETUP_ACTION: ${{ needs.pick.outputs.setup_action }}
        run: |
          cp -r "$SETUP_ACTION" .ns-lane-setup
          echo ".ns-lane-setup/" >> .git/info/exclude
      - name: Lane setup action
        if: needs.pick.outputs.setup_action != ''
        uses: ./.ns-lane-setup

      # Claude Code goes into this job's temp directory, which the runner empties before every job, so
      # nothing a run leaves behind on a self-hosted machine is what the next job executes as `claude`.
      - name: Install Claude Code
        if: needs.pick.outputs.provider != 'codex'
        run: |
          npm install -g --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || 'latest' }}"
          echo "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"

      # Same rule for Codex: a fresh install in this job's temp directory.
      - name: Install Codex
        if: needs.pick.outputs.provider == 'codex'
        run: |
          npm install -g --prefix "$RUNNER_TEMP/codex" "@openai/codex@${{ vars.CODEX_VERSION || 'latest' }}"
          echo "$RUNNER_TEMP/codex/bin" >> "$GITHUB_PATH"

      - name: Run agent
        env:
          PROVIDER: ${{ needs.pick.outputs.provider || 'claude' }}
          # A lane's caller passes only its own provider's tokens, so two of these four are always empty.
          LANE_CLAUDE_TOKEN: ${{ secrets.claude_token }}
          LANE_CLAUDE_FALLBACK: ${{ secrets.claude_token_fallback }}
          LANE_CODEX_TOKEN: ${{ secrets.codex_token }}
          LANE_CODEX_FALLBACK: ${{ secrets.codex_token_fallback }}
          # 'true' puts the token back in Claude's environment (for Claude Code versions without
          # CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR). Tests and tools the agent runs can then read it.
          TOKEN_IN_ENV: ${{ vars.NIGHT_SHIFT_TOKEN_IN_ENV || 'false' }}
          # Empty for a Codex lane without a model: Codex then uses its own default model.
          MODEL: ${{ needs.pick.outputs.model || (needs.pick.outputs.provider != 'codex' && 'sonnet' || '') }}
          MAX_TURNS: ${{ needs.pick.outputs.max_turns || '80' }}
          # This runner holds no GitHub write credentials. A GitHub-hosted one is discarded after the job;
          # a self-hosted one is not, so register agent runners as ephemeral (see SECURITY.md).
          PERMISSION_FLAGS: ${{ vars.CLAUDE_PERMISSION_FLAGS || '--dangerously-skip-permissions' }}
          # Codex's own sandbox blocks the network (package installs) and needs kernel features hosted runners
          # may lack, so like Claude it runs unsandboxed on a runner that is itself the sandbox.
          CODEX_PERMISSION_FLAGS: ${{ vars.CODEX_PERMISSION_FLAGS || '--dangerously-bypass-approvals-and-sandbox' }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build and test caches never belong in an agent PR, even when the repo has no .gitignore for them
          # (seen live: committed __pycache__/*.pyc failed the review's scope question). Untracked files only.
          printf '%s\n' '__pycache__/' '*.py[cod]' '.pytest_cache/' '.mypy_cache/' '.ruff_cache/' '.venv/' \
            'node_modules/' '.DS_Store' > "$RUNNER_TEMP/agent-excludes"
          git config core.excludesFile "$RUNNER_TEMP/agent-excludes"
          git switch -c "$BRANCH"
          PROMPT="$(sed "s|__TASK_FILE__|$RUNNER_TEMP/task/task.md|g" "$RUNNER_TEMP/task/prompt.md")"
          # Claude reads the token from a pipe (file descriptor 3), not from its environment, so the commands it
          # runs (tests, package scripts, `env`) do not inherit it. This stops accidental leaks; an agent that
          # sets out to find its own token still can, which is what the token guard below is for.
          # The step runs under `bash -e`: a failing agent must not end it before the fallback gets its turn, so
          # its exit code is kept in RC and returned at the end.
          RC=0
          PROVIDER="${PROVIDER:-claude}"
          STDERR="$OUT/$PROVIDER.stderr"
          run_claude() {  # $1: the Claude token for this attempt
            if [ "$TOKEN_IN_ENV" = "true" ]; then
              export CLAUDE_CODE_OAUTH_TOKEN="$1"; exec 3< /dev/null
            else
              export CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3; exec 3< <(printf '%s' "$1")
            fi
            # shellcheck disable=SC2086  # PERMISSION_FLAGS is intentionally word-split
            env -u LANE_CLAUDE_TOKEN -u LANE_CLAUDE_FALLBACK -u LANE_CODEX_TOKEN -u LANE_CODEX_FALLBACK \
              claude -p "$PROMPT" --output-format json \
              --json-schema "$(cat "$RUNNER_TEMP/task/schema.json")" \
              --model "$MODEL" --max-turns "$MAX_TURNS" $PERMISSION_FLAGS > "$OUT/result.json" 2> "$STDERR" \
              && RC=0 || RC=$?
            echo "claude exit code: $RC (model $MODEL)"
            exec 3<&-
            unset CLAUDE_CODE_OAUTH_TOKEN
          }
          # Codex reads its key from CODEX_API_KEY. The key is exported inside a subshell (never on a command
          # line, where `ps` would show it), and Codex's shell environment policy strips it, with every other
          # *KEY*/*SECRET*/*TOKEN* variable, from the commands the agent runs. As with Claude, an agent that
          # sets out to find its key still can; the token guard covers that. Codex has no turn limit: the job's
          # timeout bounds the run. Its events and final message are reshaped for publish by providers.py.
          run_codex() {  # $1: the OpenAI API key for this attempt
            local model_flag=()
            if [ -n "$MODEL" ]; then model_flag=(--model "$MODEL"); fi
            rm -rf "$RUNNER_TEMP/codex-home"; mkdir -p "$RUNNER_TEMP/codex-home"
            # shellcheck disable=SC2086  # CODEX_PERMISSION_FLAGS is intentionally word-split
            (
              export CODEX_HOME="$RUNNER_TEMP/codex-home" CODEX_API_KEY="$1"
              unset LANE_CLAUDE_TOKEN LANE_CLAUDE_FALLBACK LANE_CODEX_TOKEN LANE_CODEX_FALLBACK
              exec codex exec --json --ephemeral --output-schema "$RUNNER_TEMP/task/schema.codex.json" \
                --output-last-message "$OUT/last-message.json" \
                -c shell_environment_policy.ignore_default_excludes=false \
                -c 'shell_environment_policy.exclude=["CODEX_API_KEY", "OPENAI_API_KEY", "CODEX_HOME"]' \
                "${model_flag[@]}" $CODEX_PERMISSION_FLAGS "$PROMPT" < /dev/null
            ) > "$OUT/codex.jsonl" 2> "$STDERR" && RC=0 || RC=$?
            echo "codex exit code: $RC (model ${MODEL:-codex default})"
          }
          run_agent() {
            if [ "$PROVIDER" = "codex" ]; then run_codex "$1"; else run_claude "$1"; fi
          }
          # Same rule as the publish job's infra-error: no structured output and fewer than 2 turns (Codex: 2
          # completed work items) means the run never really started (usage limit, bad token, outage).
          never_started() {
            local turns
            if [ "$PROVIDER" = "codex" ]; then
              if jq -e 'type == "object" and (.status | type) == "string"' "$OUT/last-message.json" > /dev/null 2>&1; then
                turns=99
              else
                turns="$(jq -s '[.[] | select(.type == "item.completed" and .item.type != "reasoning")] | length' \
                  "$OUT/codex.jsonl" 2>/dev/null || echo 0)"
              fi
            else
              turns="$(jq -r 'if (.structured_output | type) == "object" then 99 else (.num_turns // 0) end' \
                "$OUT/result.json" 2>/dev/null || echo 0)"
            fi
            [ "${turns:-0}" -lt 2 ] && [ "$(git rev-list --count "origin/$MAIN_BRANCH..HEAD")" -eq 0 ]
          }
          if [ "$PROVIDER" = "codex" ]; then
            TOKEN="$LANE_CODEX_TOKEN"; FALLBACK="$LANE_CODEX_FALLBACK"
          else
            TOKEN="$LANE_CLAUDE_TOKEN"; FALLBACK="$LANE_CLAUDE_FALLBACK"
          fi
          if [ -n "$TOKEN" ]; then
            run_agent "$TOKEN"
            if [ -n "$FALLBACK" ] && never_started; then
              echo "::warning::The lane's $PROVIDER token did not start a run (usage limit or sign-in); retrying with its fallback token"
              mv "$STDERR" "$OUT/$PROVIDER.primary.stderr"
              rm -f "$OUT/last-message.json"
              git checkout -q -- . 2>/dev/null || true
              run_agent "$FALLBACK"
              echo "$PROVIDER token: fallback"
            fi
          else
            run_agent "$FALLBACK"
            echo "$PROVIDER token: fallback"
          fi
          unset TOKEN FALLBACK
          tail -n 50 "$STDERR" || true
          exit "$RC"

      - name: Package commits
        if: always()
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          STATUS="$(jq -r '.structured_output.status // empty' "$OUT/result.json" 2>/dev/null || true)"
          if [ -z "$STATUS" ]; then  # a Codex run: its final message is the structured output
            STATUS="$(jq -r '.status // empty' "$OUT/last-message.json" 2>/dev/null || true)"
          fi
          if [ "$STATUS" = "done" ] && [ -n "$(git status --porcelain)" ]; then
            git add -A && git commit -m "night-shift($LANE): uncommitted changes from agent run"
          fi
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "$BRANCH" ] && \
             [ "$(git rev-list --count "origin/$MAIN_BRANCH..HEAD")" -gt 0 ]; then
            git bundle create "$OUT/agent.bundle" "$BRANCH" "^origin/$MAIN_BRANCH"
          fi
          ls -la "$OUT"

      # Everything that leaves this runner (the commits, the result and the logs, all in the artifact) is searched
      # for the lane's model token first (Claude token or OpenAI API key, and the fallback). On a hit nothing is
      # uploaded and the issue goes to a person.
      - name: Token guard
        if: always()
        env:
          PROVIDER: ${{ needs.pick.outputs.provider || 'claude' }}
          LANE_CLAUDE_TOKEN: ${{ secrets.claude_token }}
          LANE_CLAUDE_FALLBACK: ${{ secrets.claude_token_fallback }}
          LANE_CODEX_TOKEN: ${{ secrets.codex_token }}
          LANE_CODEX_FALLBACK: ${{ secrets.codex_token_fallback }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          PROVIDER="${PROVIDER:-claude}"
          PATTERNS="$(mktemp)"; chmod 600 "$PATTERNS"
          # Each token (the lane's and its fallback) and its base64 form, read from a file so none appears in a
          # command line. An OpenAI key is also matched without its `sk-...-` prefix, the part that is secret.
          for RAW in "${LANE_CLAUDE_TOKEN:-}" "${LANE_CLAUDE_FALLBACK:-}" "${LANE_CODEX_TOKEN:-}" "${LANE_CODEX_FALLBACK:-}"; do
            TOKEN="$(printf '%s' "$RAW" | tr -d '[:space:]')"
            if [ "${#TOKEN}" -ge 20 ]; then
              { printf '%s\n' "$TOKEN"; printf '%s' "$TOKEN" | base64 | tr -d '\n'; echo; } >> "$PATTERNS"
              BODY="${TOKEN##*-}"
              if [ "${TOKEN#sk-}" != "$TOKEN" ] && [ "${#BODY}" -ge 20 ]; then printf '%s\n' "$BODY" >> "$PATTERNS"; fi
            fi
          done
          if [ ! -s "$PATTERNS" ]; then rm -f "$PATTERNS"; echo "no token to guard"; exit 0; fi
          WHERE=""
          if grep -rqaF -f "$PATTERNS" "$OUT"; then WHERE="the run's result or log"; fi
          if git rev-parse -q --verify "refs/heads/$BRANCH" > /dev/null; then
            RANGE="origin/$MAIN_BRANCH..refs/heads/$BRANCH"
            # Only when the run made commits: with none, `xargs -r` runs nothing and exits 0, which would read
            # as a match and withhold every run that ends blocked or waiting.
            if [ "$(git rev-list --count "$RANGE")" -gt 0 ]; then
              if git log --format=%B "$RANGE" | grep -qaF -f "$PATTERNS" || \
                 git rev-list "$RANGE" | xargs git grep -qaF -f "$PATTERNS"; then
                WHERE="${WHERE:+$WHERE and }its commits"
              fi
            fi
          fi
          rm -f "$PATTERNS"
          if [ -n "$WHERE" ]; then
            rm -rf "$OUT"; mkdir -p "$OUT"
            jq -n --arg where "$WHERE" --arg provider "$PROVIDER" \
              '{night_shift_guard: "token-leak", where: $where, provider: $provider}' > "$OUT/result.json"
            echo "::error::The lane's $PROVIDER token appeared in $WHERE. Nothing from this run was uploaded; rotate the token."
          else
            echo "token guard: clean"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ inputs.lane }}
          path: ${{ runner.temp }}/out
          retention-days: 3

  publish:
    needs: [pick, agent]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.mode != 'skip'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
      PYTHONSAFEPATH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out gh-nightshift scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false
      - name: Mint a GitHub App token (this repo only, never the Workflows permission)
        if: inputs.app_id != ''
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: python3 -m nightshift app-token --github-env "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: out-${{ inputs.lane }}
          path: ${{ runner.temp }}/out

      - name: Validate, open PR, report
        env:
          GH_TOKEN: ${{ env.NIGHT_SHIFT_APP_TOKEN || secrets.agent_pat }}
          MODE: ${{ needs.pick.outputs.mode }}
          ISSUE: ${{ needs.pick.outputs.issue }}
          BRANCH: ${{ needs.pick.outputs.branch }}
          TITLE: ${{ needs.pick.outputs.title }}
          ATTEMPT_COMMENT: ${{ needs.pick.outputs.attempt_comment }}
          FAIL_SHA: ${{ needs.pick.outputs.fail_sha }}
          MODEL: ${{ needs.pick.outputs.model }}
          PROMPT_VERSION: ${{ needs.pick.outputs.prompt_version }}
        run: |
          python3 -m nightshift publish --lane "$LANE" --mode "$MODE" --issue "$ISSUE" --branch "$BRANCH" \
            --title "$TITLE" --model "$MODEL" --attempt-comment "$ATTEMPT_COMMENT" --fail-sha "$FAIL_SHA" \
            --prompt-version "$PROMPT_VERSION" \
            --result "$RUNNER_TEMP/out/result.json" --bundle "$RUNNER_TEMP/out/agent.bundle"
