# gh-nightshift: the independent review gate for agent PRs (head branch agent/...).
# A separate Claude run with read-only tools answers one yes/no question per failure type, plus whether
# main moved under the PR in anything it touches (audit add-on B), plus one answer per hit of the repo's own
# review rules (.night-shift/review-rules.yml on the base branch). The `verdict` job fails on "fail",
# which blocks the merge; the picker then closes the PR with reason `verdict_failed`.
# The optional `security` job is a second read-only reviewer that looks only for exploitable changes. It
# calls Claude only when a security rule, a security path or security.always triggers it; a failure closes
# the PR with reason `security_failed`.
#
# Trust boundary: the prompt and the reviewer's working directory (CLAUDE.md, .claude/, .night-shift/)
# come from the BASE branch. The PR's code is mounted read-only as material under review.
name: night-shift-review

on:
  workflow_call:
    inputs:
      agent_runs_on:
        description: >-
          Runner labels (JSON) for the reviewer. It runs Claude on PR content and holds no PAT or App key,
          so it belongs with the agent jobs, never on a box that runs the token jobs
        type: string
        required: false
        default: '"ubuntu-latest"'
      tool_repo:
        type: string
        required: false
        default: paawandesai/gh-nightshift
      tool_ref:
        type: string
        required: false
        default: main
      model:
        type: string
        required: false
        default: ""
      security:
        description: >-
          Run the security gate (required check `review / security`). It calls Claude only when a PR hits a
          `security: true` rule in .night-shift/review-rules.yml, touches security.paths or risk.approve_paths,
          or security.always is on; otherwise it passes at once
        type: boolean
        required: false
        default: false
      security_model:
        type: string
        required: false
        default: ""
      reuse_verdict:
        description: >-
          Keep a passed verdict when a push only merged main (update-branch) and main changed none of the PR's
          files or the review inputs; needs checks: read (or actions: read) in the caller. CI still runs
        type: boolean
        required: false
        default: true
    secrets:
      claude_token:
        required: false
      security_claude_token:
        description: Claude token for the security reviewer; the review token is used when this is empty
        required: false

# Permissions come from the caller (night-shift-review.yml, generated by `init`): contents: read,
# pull-requests: write, issues: write, plus checks: read and actions: read for verdict reuse. They are not
# repeated here because a called workflow can only narrow its caller's grant: a block here would cap the
# token below what reuse needs, and asking for more than an older caller grants fails the run. `doctor`
# checks the caller's block. Without checks or actions read, the review simply runs in full.

jobs:
  verdict:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ${{ fromJSON(inputs.agent_runs_on) }}
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      # The PR's head before this push (pull_request synchronize); verdict reuse requires the merge to sit on it.
      BEFORE: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
      PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
      # Never import from the checked-out repo: a planted json.py or nightshift/ would run with the PAT.
      PYTHONSAFEPATH: "1"
    steps:
      - name: Check out base (trusted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out PR head (under review)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check out gh-nightshift scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false

      - name: Gather ticket, diff and what changed on main
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/review"; mkdir -p "$WORK"
          # The checkouts keep no credentials (persist-credentials: false), so on a private repo this fetch must
          # carry the job token itself. It is passed for this one command only and never written to disk.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          git -C pr -c "http.https://github.com/.extraheader=$AUTH" fetch -q origin "$BASE_REF"
          python3 -m nightshift review-inputs --pr-dir pr --base-ref "origin/$BASE_REF" --head-ref "$HEAD_REF" \
            --out-dir "$WORK" --rules-root base --github-output "$GITHUB_OUTPUT" \
            --reuse-check "${{ inputs.reuse_verdict && 'verdict' || '' }}" --before "$BEFORE"

      - name: Reuse the passed verdict (only main moved)
        if: steps.gather.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          jq -n --rawfile b "$RUNNER_TEMP/review/reuse.md" '{body: $b}' | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - >/dev/null || true

      # Node for Claude Code, in case a self-hosted runner has none.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gather.outputs.reuse == ''
        with:
          node-version: 22
      # Claude Code goes into this job's temp directory, which the runner empties before every job, so
      # nothing a run leaves behind on a self-hosted machine is what the next job executes as `claude`.
      - name: Install Claude Code
        if: steps.gather.outputs.reuse == ''
        run: |
          npm install -g --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || '2.1.319' }}"
          echo "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"

      - name: Review
        id: review
        if: steps.gather.outputs.reuse == ''
        working-directory: base
        env:
          TOKEN: ${{ secrets.claude_token }}
          TOKEN_IN_ENV: ${{ vars.NIGHT_SHIFT_TOKEN_IN_ENV || 'false' }}
          REVIEW_MODEL: ${{ inputs.model || vars.REVIEW_MODEL || 'opus' }}
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/review"; PR_DIR="$GITHUB_WORKSPACE/pr"
          if [ -z "$TOKEN" ]; then echo "::error::The review Claude token (review_token_secret, default CLAUDE_TOKEN_REVIEW) is empty"; exit 1; fi
          # Prompt: base branch's .night-shift/prompts/review.md if present, else gh-nightshift's default.
          PROMPT="$(python3 -m nightshift prompt review --root . --set ISSUE_FILE="$WORK/issue.md" \
            --set DIFF_FILE="$WORK/diff.patch" --set DRIFT_FILE="$WORK/drift.md" --set RULES_FILE="$WORK/rules.md" \
            --set PR_DIR="$PR_DIR")"
          SCHEMA="$(python3 -m nightshift schema review)"
          # M4: the token reaches Claude on a pipe (fd 3), never in its environment, and Read is denied under /proc and
          # /sys, where this step's own environment block (which holds the token) can be read.
          token_fd() { if [ "$TOKEN_IN_ENV" = "true" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$TOKEN"; exec 3< /dev/null; else export CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3; exec 3< <(printf '%s' "$TOKEN"); fi; }
          # The token guard: a file that holds the token (or its base64 form) is never posted.
          leaks() { local t; t="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"; [ "${#t}" -ge 20 ] || return 1
            grep -qaF -f <(printf '%s\n' "$t"; printf '%s' "$t" | base64 | tr -d '\n'; echo) "$1"; }
          # Read-only: in -p runs, any tool not allowed here is denied.
          token_fd
          env -u TOKEN claude -p "$PROMPT" --output-format json --json-schema "$SCHEMA" --max-turns 30 --model "$REVIEW_MODEL" \
            --add-dir "$WORK" "$PR_DIR" --allowedTools "Read,Grep,Glob" \
            --disallowedTools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//sys/**)" > "$WORK/review.json" 2> "$WORK/review.stderr"
          echo "claude exit code: $?"; exec 3<&-
          if leaks "$WORK/review.json"; then
            echo '{"is_error": true, "result": "withheld: the output held the review token"}' > "$WORK/review.json"
            echo "::error::The reviewer's output held its Claude token; it was withheld. Rotate the token."
          fi
          python3 -m nightshift review-report --result "$WORK/review.json" --out "$WORK/comment.md" \
            --overlap "${{ steps.gather.outputs.overlap || 0 }}" --rules "$WORK/rule_hits.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Post review and set verdict
        if: steps.gather.outputs.reuse == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          ISSUE: ${{ steps.gather.outputs.issue }}
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/review"
          jq -n --rawfile b "$WORK/comment.md" '{body: $b}' | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - >/dev/null || true
          if [ "$VERDICT" = "error" ]; then
            # The reviewer itself broke (expired token, usage limit): the picker refunds the attempt.
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=review-error" >/dev/null || true
            echo "::error::Review run failed (not a verdict on the code)"; exit 1
          fi
          if [ "$VERDICT" != "pass" ] && [ -n "$ISSUE" ]; then
            # Put the findings on the issue too, so the next attempt reads them.
            jq -n --rawfile b "$WORK/comment.md" '{body: $b}' | gh api -X POST "repos/$REPO/issues/$ISSUE/comments" --input - >/dev/null || true
          fi
          if [ "$VERDICT" != "pass" ]; then echo "::error::Review verdict: $VERDICT"; exit 1; fi

      - name: Mark a review gate that broke before the reviewer answered
        # e.g. the gather step failed: not a verdict on the code, so the picker refunds the attempt.
        if: failure() && steps.review.outputs.verdict == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=review-error" >/dev/null || true

  security:
    if: inputs.security && startsWith(github.head_ref, 'agent/')
    runs-on: ${{ fromJSON(inputs.agent_runs_on) }}
    timeout-minutes: 25
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      # The PR's head before this push (pull_request synchronize); verdict reuse requires the merge to sit on it.
      BEFORE: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
      PYTHONPATH: ${{ github.workspace }}/.nightshift-tool
      PYTHONSAFEPATH: "1"
    steps:
      - name: Check out base (trusted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out PR head (under review)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check out gh-nightshift scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: .nightshift-tool
          persist-credentials: false

      - name: Gather ticket, diff and security rule hits
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/review"; mkdir -p "$WORK"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          git -C pr -c "http.https://github.com/.extraheader=$AUTH" fetch -q origin "$BASE_REF"
          python3 -m nightshift review-inputs --pr-dir pr --base-ref "origin/$BASE_REF" --head-ref "$HEAD_REF" \
            --out-dir "$WORK" --rules-root base --github-output "$GITHUB_OUTPUT" \
            --reuse-check "${{ inputs.reuse_verdict && 'security' || '' }}" --before "$BEFORE"

      - name: Reuse the passed security verdict (only main moved)
        if: steps.gather.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          jq -n --rawfile b "$RUNNER_TEMP/review/reuse.md" '{body: $b}' | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - >/dev/null || true

      - name: Nothing to review
        if: steps.gather.outputs.reuse == '' && steps.gather.outputs.security != 'true'
        run: echo "No security rule, security path or security.always applies to this PR; passing."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gather.outputs.reuse == '' && steps.gather.outputs.security == 'true'
        with:
          node-version: 22
      - name: Install Claude Code
        if: steps.gather.outputs.reuse == '' && steps.gather.outputs.security == 'true'
        run: |
          npm install -g --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || '2.1.319' }}"
          echo "$RUNNER_TEMP/claude-code/bin" >> "$GITHUB_PATH"

      - name: Security review
        id: review
        if: steps.gather.outputs.reuse == '' && steps.gather.outputs.security == 'true'
        working-directory: base
        env:
          TOKEN: ${{ secrets.security_claude_token || secrets.claude_token }}
          TOKEN_IN_ENV: ${{ vars.NIGHT_SHIFT_TOKEN_IN_ENV || 'false' }}
          SECURITY_MODEL: ${{ inputs.security_model || inputs.model || vars.REVIEW_MODEL || 'opus' }}
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/review"; PR_DIR="$GITHUB_WORKSPACE/pr"
          if [ -z "$TOKEN" ]; then echo "::error::The security reviewer's Claude token (security.claude_token_secret, else review_token_secret) is empty"; exit 1; fi
          PROMPT="$(python3 -m nightshift prompt security --root . --set ISSUE_FILE="$WORK/issue.md" \
            --set DIFF_FILE="$WORK/diff.patch" --set RULES_FILE="$WORK/security_rules.md" \
            --set TRIGGER_FILE="$WORK/security_trigger.md" --set PR_DIR="$PR_DIR")"
          SCHEMA="$(python3 -m nightshift schema security)"
          # M4: the token reaches Claude on a pipe (fd 3), never in its environment, and Read is denied under /proc and
          # /sys, where this step's own environment block (which holds the token) can be read.
          token_fd() { if [ "$TOKEN_IN_ENV" = "true" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$TOKEN"; exec 3< /dev/null; else export CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3; exec 3< <(printf '%s' "$TOKEN"); fi; }
          # The token guard: a file that holds the token (or its base64 form) is never posted.
          leaks() { local t; t="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"; [ "${#t}" -ge 20 ] || return 1
            grep -qaF -f <(printf '%s\n' "$t"; printf '%s' "$t" | base64 | tr -d '\n'; echo) "$1"; }
          # Read-only, like the review gate: in -p runs, any tool not allowed here is denied.
          token_fd
          env -u TOKEN claude -p "$PROMPT" --output-format json --json-schema "$SCHEMA" --max-turns 40 --model "$SECURITY_MODEL" \
            --add-dir "$WORK" "$PR_DIR" --allowedTools "Read,Grep,Glob" \
            --disallowedTools "Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//sys/**)" > "$WORK/security.json" 2> "$WORK/security.stderr"
          echo "claude exit code: $?"; exec 3<&-
          if leaks "$WORK/security.json"; then
            echo '{"is_error": true, "result": "withheld: the output held the review token"}' > "$WORK/security.json"
            echo "::error::The security reviewer's output held its Claude token; it was withheld. Rotate the token."
          fi
          python3 -m nightshift review-report --security --result "$WORK/security.json" --out "$WORK/security.md" \
            --rules "$WORK/security_hits.json" --github-output "$GITHUB_OUTPUT"

      - name: Post security review and set verdict
        if: steps.gather.outputs.reuse == '' && steps.gather.outputs.security == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          ISSUE: ${{ steps.gather.outputs.issue }}
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/review"
          jq -n --rawfile b "$WORK/security.md" '{body: $b}' | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - >/dev/null || true
          if [ "$VERDICT" = "error" ]; then
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=review-error" >/dev/null || true
            echo "::error::Security review run failed (not a verdict on the code)"; exit 1
          fi
          if [ "$VERDICT" != "pass" ] && [ -n "$ISSUE" ]; then
            jq -n --rawfile b "$WORK/security.md" '{body: $b}' | gh api -X POST "repos/$REPO/issues/$ISSUE/comments" --input - >/dev/null || true
          fi
          if [ "$VERDICT" != "pass" ]; then echo "::error::Security verdict: $VERDICT"; exit 1; fi

      - name: Mark a security gate that broke before the reviewer answered
        if: failure() && steps.review.outputs.verdict == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=review-error" >/dev/null || true
