# Example .night-shift/config.yml for a repo with an API and a web app.
version: 1
main_branch: main
ci_workflow: ci.yml            # its runs on main gate every lane
required_checks: [test, "review / verdict"]
fix_lane: api                  # the only lane that works while main is red
tool_ref: v0.1.2               # a release tag or SHA; `doctor` warns about a moving branch
# extends: your-org/.github     # optional org-wide base; `gh nightshift config pull` writes .night-shift/base.yml
bot_login: night-bot            # login of the account that owns AGENT_PAT (stats and audit trust its markers)
trusted_logins: [bob]          # other PAT logins to trust (here Bob's own PAT for the web lane)
merge:
  mode: strict                 # strict: PRs must be up to date with main; queue: GitHub merge queue
protected_paths: [contracts/]  # added to .github/, .claude/, CLAUDE.md, AGENTS.md, .mcp.json, .night-shift/
models:
  default: sonnet
  escalate: opus
  review: opus
  planner: opus
limits:
  max_attempts: 3
  infra_cap: 6
  stale_minutes: 45
  max_turns: 80
  max_needs_per_issue: 2
  max_notes_per_issue: 2
  auto_ready_needs: false   # true: an agent's request to another lane is queued without a person promoting it
planner:
  docs: [docs/PRD.md]
  max_tickets_per_run: 8
  refill_below: 3              # auto-refill: run gap mode for a lane with fewer ready issues
  id_prefixes: {api: A, web: W}
  human_paths: [contracts/]
# auth:                        # optional: a GitHub App instead of AGENT_PAT (see README, "GitHub App")
#   mode: app
#   app_id: 123456
#   private_key_secret: NIGHT_SHIFT_APP_KEY
risk:                          # optional: green PRs merge unless a rule below asks for a human approval
  default: auto                # or approve: every PR needs one, except auto_labels
  approve_labels: [risk:high]
  approve_paths: [migrations/]
  auto_labels: [risk:low]
  codeowners: true             # files with CODEOWNERS owners need one of those owners' approval
digest:
  enabled: true
  schedule: "0 7 * * *"         # morning summary on the night-log issue (UTC)
  weekly_schedule: "0 8 * * 1"  # the 7-day weekly report ("" turns it off)
  webhook_secret: NIGHT_SHIFT_WEBHOOK   # optional: Slack or Discord webhook URL
lanes:
  - name: api
    description: REST API and database
    paths: [api/]
    claude_token_secret: CLAUDE_TOKEN_ALICE
    fallback_token_secret: CLAUDE_TOKEN_ALICE_2   # optional: used only when Alice's token hits a usage limit
    model: sonnet
    postgres_image: "postgres:16"
    setup:
      commands: |
        python -m pip install -r api/requirements.txt
    test_command: pytest api
  - name: web
    paths: [web/]
    claude_token_secret: CLAUDE_TOKEN_BOB
    agent_pat_secret: AGENT_PAT_BOB   # optional: PRs credited to Bob; falls back to AGENT_PAT
    budget_usd_per_night: 20          # optional: stop picking for the night at this API-equivalent spend
    setup:
      commands: [cd web && npm ci]
      action: .night-shift/actions/web-setup
    test_command: cd web && npm test
